<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKB48 × ニッポンエール 巡回表</title><style>body{margin:0;background:#f6f7fb;color:#1d2330;font-family:system-ui,'Noto Sans JP',sans-serif}header{background:#e83c76;color:white;padding:32px max(20px,calc((100% - 1000px)/2))}h1{margin:8px 0;font-size:clamp(25px,4vw,38px)}main{max-width:1000px;margin:auto;padding:24px 16px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat,.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 14px #1b233010}.stat{flex:1;min-width:140px}.stat b{font-size:28px;display:block}.panel{margin-top:18px}input,select{padding:12px;border:1px solid #d7dbe3;border-radius:9px;font-size:16px;max-width:100%}.filters{display:flex;gap:10px;flex-wrap:wrap}.item{border-top:1px solid #eee;padding:16px 0}.item:first-child{border:0}a{color:#b6235d}small,.muted{color:#687080}.tag{display:inline-block;background:#fff1f6;color:#ae225b;border-radius:20px;padding:4px 10px;font-size:12px}</style></head><body><header><small style="color:white">AKB48 × ニッポンエール</small><h1>全国イベント巡回表</h1><div>公式サイトの告知候補を収集・確認する個人用ダッシュボード</div></header><main><div class="stats"><div class="stat"><b id="total">—</b><small>収集した告知候補</small></div><div class="stat"><b id="new">—</b><small>今回の新着候補</small></div><div class="stat"><b id="sources">—</b><small>登録した収集元</small></div></div><section class="panel"><h2>検索・絞り込み</h2><div class="filters"><input id="q" placeholder="会場・県名・キーワード"><select id="pref"><option value="">全国</option></select></div><p class="muted">※候補リンクの自動検出段階です。出演メンバーは未検証のため自動確定しません。</p></section><section class="panel"><h2>公式告知候補</h2><div id="items">読み込み中…</div></section><section class="panel"><h2>更新状況</h2><p id="status">—</p><div id="errors"></div></section></main><script>const PREF='北海道 青森 岩手 宮城 秋田 山形 福島 茨城 栃木 群馬 埼玉 千葉 東京 神奈川 新潟 富山 石川 福井 山梨 長野 岐阜 静岡 愛知 三重 滋賀 京都 大阪 兵庫 奈良 和歌山 鳥取 島根 岡山 広島 山口 徳島 香川 愛媛 高知 福岡 佐賀 長崎 熊本 大分 宮崎 鹿児島 沖縄'.split(' ');for(const p of PREF){let o=document.createElement('option');o.value=p;o.textContent=p;document.querySelector('#pref').append(o)}let records=[];const safe=(s)=>String(s||'');function render(){let q=document.querySelector('#q').value.toLowerCase(),p=document.querySelector('#pref').value;let list=records.filter(x=>(safe(x.title)+' '+safe(x.url)).toLowerCase().includes(q)&&(!p||(x.prefectures_mentioned||[]).includes(p)));let box=document.querySelector('#items');box.replaceChildren();if(!list.length){box.textContent='一致する候補はありません。';return}for(let x of list){let d=document.createElement('div');d.className='item';let tag=document.createElement('span');tag.className='tag';tag.textContent=x.source_type||'公式サイト';let h=document.createElement('h3');let a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=x.title||x.url;h.append(a);let sub=document.createElement('small');sub.textContent='都道府県: '+((x.prefectures_mentioned||[]).join('、')||'未判定')+' ｜ 出演者: 要確認';d.append(tag,h,sub);box.append(d)}}document.querySelector('#q').addEventListener('input',render);document.querySelector('#pref').addEventListener('change',render);Promise.all([fetch('./data/candidates.json').then(r=>r.ok?r.json():[]),fetch('./data/status.json').then(r=>r.ok?r.json():{})]).then(([a,s])=>{records=a;document.querySelector('#total').textContent=a.length;document.querySelector('#new').textContent=s.new_candidates??'—';document.querySelector('#sources').textContent=s.sources_configured??'—';document.querySelector('#status').textContent='最終実行: '+(s.last_run||'未実行');document.querySelector('#errors').textContent=(s.errors||[]).length+'件の取得エラー';render()}).catch(e=>document.querySelector('#items').textContent='データを読み込めません: '+e.message)</script></body></html>
